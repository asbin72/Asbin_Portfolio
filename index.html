<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Asbin T S — Software Developer</title>
    <meta name="description" content="Portfolio of Asbin T S, Software Developer building modern full-stack web applications with React, TypeScript, Java, Spring Boot, and MySQL." />
    <meta name="keywords" content="Asbin T S, Software Developer, React, TypeScript, Java, Spring Boot, MySQL, Full Stack" />
    <meta name="author" content="Asbin T S" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Asbin T S — Software Developer" />
    <meta property="og:description" content="Portfolio of Asbin T S, Software Developer building modern full-stack web applications." />
    <meta property="og:url" content="https://asbints.dev" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asbin T S — Software Developer" />
    <meta name="twitter:description" content="Portfolio of Asbin T S, Software Developer building modern full-stack web applications." />

    <!-- Theme -->
    <meta name="theme-color" content="#070707" />
    <meta name="color-scheme" content="dark" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <!-- Skip to main content for accessibility -->
    <a
      href="#main-content"
      style="
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 99999;
        background: #C8FF00;
        color: #070707;
        padding: 12px 24px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-decoration: none;
        font-weight: 700;
      "
      onfocus="this.style.left='0'"
      onblur="this.style.left='-9999px'"
    >
      SKIP TO CONTENT
    </a>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
